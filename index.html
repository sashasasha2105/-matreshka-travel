
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#FCFCFD">
    <meta name="description" content="Матрешка — откройте для себя красоту и разнообразие России. Путешествуйте по регионам, выполняйте задания, получайте награды.">

    <title>Матрешка — Путешествуй по России</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles/global.css?v=3000">
    <link rel="stylesheet" href="styles/matreshka-optimized.css?v=3000">
    <link rel="stylesheet" href="styles/marquee-hero.css?v=3000">
    <link rel="stylesheet" href="components/TripDatePicker/TripDatePickerSection.css?v=3000">
    <link rel="stylesheet" href="styles/focus-cards-minimal.css?v=3000">
    <link rel="stylesheet" href="styles/apple-cards-carousel.css?v=3000">
    <link rel="stylesheet" href="styles/region-details-premium.css?v=3000">
    <link rel="stylesheet" href="styles/partner-cards-minimal.css?v=3000">
    <link rel="stylesheet" href="profile/profile.css?v=3000">
    <link rel="stylesheet" href="profile/profile-light.css?v=3000">
    <link rel="stylesheet" href="quests/quests.css?v=3000">
    <link rel="stylesheet" href="quests/quests-light.css?v=3000">
    <link rel="stylesheet" href="qr/qr.css?v=3000">
    <link rel="stylesheet" href="maps/maps2gis_new.css?v=3000">
    <link rel="stylesheet" href="styles/liquid-glass.css?v=3000">
    <link rel="stylesheet" href="styles/payment-modal.css?v=3000">
    <link rel="stylesheet" href="profile/modern-modal.css?v=3000">
    <link rel="stylesheet" href="styles/redesign-2025.css?v=2">

    <!-- External Scripts -->
    <script src="https://telegram.org/js/telegram-web-app.js" async defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
    <script src="https://mapgl.2gis.com/api/js/v1" async defer></script>
    
    <!-- Core Application Scripts -->
    <script src="scripts/core/navigation.js" defer></script>
    <script src="scripts/core/modal-manager.js" defer></script>
    <script src="scripts/core/storage.js" defer></script>
    <script src="scripts/core/travel-database.js" defer></script>
</head>
<body>
    <div class="container main-layout">
        <!-- Main Application Section -->
        <main id="mainSection">
            <section class="marquee-hero-section" data-animate>
                <div class="marquee-demo-wrapper">
                    <div class="marquee-container-main">
                        <div class="marquee-grid-main" id="marqueeGridMain"></div>
                        <div class="marquee-overlay-text">
                            <h1 class="marquee-overlay-title">Исследуйте<br>Россию</h1>
                            <p class="marquee-overlay-subtitle">с Матрешкой</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="date-picker-section" data-animate>
                <div id="premiumDatePicker"></div>
            </section>

            <section class="search-section" data-animate>
                <div class="destination-header">
                    <h2 class="destination-title">Направления</h2>
                </div>
                <div class="search-container">
                    <svg class="search-icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input
                        type="text"
                        id="regionSearch"
                        class="search-input"
                        placeholder="Поиск региона или города"
                        oninput="searchRegions(this.value)"
                        autocomplete="off"
                    >
                    <button class="search-clear" onclick="clearSearch()">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </section>

            <section class="regions-section" data-animate>
                <div id="regionsGrid"></div>
            </section>

            <section id="applePackagesCarousel" data-animate></section>
        </main>

        <!-- Details & Modals -->
        <section id="regionDetails" class="region-details hidden"></section>
        <section id="profileSection" class="profile-section hidden">
            <div class="profile-content"></div>
        </section>
        <section id="cartSection" class="cart-section hidden">
            <div class="cart-content"></div>
        </section>
        <section id="questsSection" class="quests-section hidden">
            <div class="quests-content"></div>
        </section>

        <!-- Loader -->
        <div id="loader" class="loader">
            <div class="loader-content">
                <div class="loader-spinner"></div>
                <div id="loaderText" class="loader-text">Загрузка</div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" onclick="showMainSection()" data-page="main">
            <svg class="nav-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <div class="nav-label">Главная</div>
        </button>
        <button class="nav-item" onclick="showProfile()" data-page="profile">
            <svg class="nav-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <div class="nav-label">Профиль</div>
        </button>
        <button class="nav-item" onclick="showQuests()" data-page="quests">
            <svg class="nav-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div class="nav-label">Задания</div>
            <span class="quests-badge" id="questsBadge">0</span>
        </button>
        <button class="nav-item" onclick="showCart()" data-page="cart">
            <svg class="nav-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <div class="nav-label">Покупки</div>
            <span class="cart-badge" id="cartBadge">0</span>
        </button>
    </nav>

    <!-- App Logic Scripts -->
    <script src="assets/data/regions.js"></script>
    <script src="assets/data/packages.js"></script>
    <script src="scripts/modules/packages.js" defer></script>
    <script src="scripts/script.js" defer></script>
    <script src="cart/cart.js" defer></script>
    <script src="qr/qr.js" defer></script>
    <script src="maps/maps2gis_new.js" defer></script>
    <script src="profile/profile.js" defer></script>
    <script src="profile/avatar_fix.js" defer></script>
    <script src="feed/feed.js" defer></script>
    <script src="quests/quests.js" defer></script>
    <script src="scripts/liquid-glass.js" defer></script>
    <script src="scripts/marquee-hero.js" defer></script>
    <script src="scripts/date-picker-premium.js" defer></script>
    <script src="scripts/focus-cards-minimal.js" defer></script>
    <script src="scripts/apple-cards-carousel.js" defer></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof PremiumDatePicker === 'function') {
            window.premiumDatePicker = new PremiumDatePicker({
                containerId: 'premiumDatePicker',
                title: 'Даты поездки',
                buttonText: 'Выбрать даты',
                onDateSelect: (start, end) => {
                    localStorage.setItem('matreshka_trip_dates', JSON.stringify({start, end, ts: Date.now()}));
                }
            });
        }
        
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader) loader.classList.remove('active');
        }, 1500);
    });

    function clearSearch() {
        const input = document.getElementById('regionSearch');
        if (input) {
            input.value = '';
            if (typeof searchRegions === 'function') {
                searchRegions('');
            }
        }
    }
    </script>
</body>
</html>
